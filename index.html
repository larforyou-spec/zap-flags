<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Larforyou · ZAP-FLAGS 3.1</title>
  <link rel="stylesheet" href="leaflet.css">
  <style>
    :root {
      --bg: #050807;
      --panel: rgba(10, 18, 16, 0.82);
      --panel-strong: rgba(16, 30, 26, 0.94);
      --green: #42d77d;
      --green-soft: #b9f5cc;
      --cyan: #7ad7ff;
      --yellow: #d7b35a;
      --red: #ff5a6f;
      --text: #ecfff2;
      --muted: #9ac9a8;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 8%, rgba(66, 215, 125, 0.16), transparent 28%),
        radial-gradient(circle at 90% 16%, rgba(122, 215, 255, 0.10), transparent 30%),
        linear-gradient(135deg, #020403 0%, #0b1110 52%, #020202 100%);
      overflow: hidden;
    }

    body::before {
      content: "Larforyou ®";
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      font-size: clamp(64px, 14vw, 220px);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.035);
      text-shadow:
        0 0 28px rgba(53, 255, 122, 0.08),
        0 0 80px rgba(78, 231, 255, 0.06);
      pointer-events: none;
      white-space: nowrap;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      right: -42px;
      bottom: 90px;
      transform: rotate(-90deg);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.28em;
      color: rgba(168, 255, 197, 0.16);
      pointer-events: none;
      z-index: 0;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
      position: relative;
      z-index: 1;
      height: 100vh;
      overflow-y: auto;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(4, 7, 6, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #f4f0df, #8fdcae);
      color: #07110d;
      box-shadow: 0 0 22px rgba(185, 245, 204, 0.20);
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green), #92ffb4);
      color: #001506;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(53, 255, 122, 0.18);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--green-soft);
      border: 1px solid rgba(53, 255, 122, 0.34);
      box-shadow: none;
    }
    .btn.danger {
      background: rgba(255, 90, 111, 0.14);
      color: #ffdbe0;
      border: 1px solid rgba(255, 90, 111, 0.44);
      box-shadow: none;
    }

    .screen {
      display: none;
      animation: show 0.28s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes show {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: center;
      padding: 56px 0 30px;
    }

    .hero-card, .panel {
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015)),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero-copy {
      padding: 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(78, 231, 255, 0.08);
      border: 1px solid rgba(78, 231, 255, 0.22);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(44px, 6.6vw, 82px);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: -0.04em;
    }

    h3 {
      margin: 0 0 10px;
      color: var(--green-soft);
    }

    p {
      color: var(--muted);
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    .phone-preview {
      min-height: 620px;
      padding: 22px;
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.11), rgba(255,255,255,0.025)),
        radial-gradient(circle at 75% 20%, rgba(122,215,255,0.12), transparent 38%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: var(--shadow);
    }

    .mock-map {
      position: relative;
      min-height: 584px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 22%, rgba(122,215,255,0.16), transparent 24%),
        radial-gradient(circle at 24% 70%, rgba(66,215,125,0.14), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.10) 0 1px, transparent 1px 60px),
        linear-gradient(45deg, rgba(255,255,255,0.055) 0 1px, transparent 1px 46px),
        #08100e;
      background-size: auto, auto, 60px 60px, 46px 46px, auto;
    }

    .mock-map::before {
      content: "";
      position: absolute;
      inset: 26px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.11);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(66,215,125,0.12), transparent 46%);
      pointer-events: none;
    }

    .map-road {
      position: absolute;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      transform-origin: center;
    }

    .road-a { width: 680px; height: 28px; left: -80px; top: 180px; transform: rotate(-24deg); }
    .road-b { width: 640px; height: 24px; left: -60px; top: 380px; transform: rotate(18deg); }
    .road-c { width: 28px; height: 700px; left: 250px; top: -40px; transform: rotate(12deg); }

    .avatar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(244, 240, 223, 0.14);
      border: 1px solid rgba(244, 240, 223, 0.62);
      box-shadow: 0 0 0 28px rgba(122,215,255,0.045), 0 0 34px rgba(66,215,125,0.20);
      font-size: 26px;
    }
.flag-pin {
      position: absolute;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      font-size: 16px;
      background: rgba(10, 18, 16, 0.90);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 12px 26px rgba(0,0,0,0.28);
    }

    .map-full .flag-pin {
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .map-full .avatar {
      z-index: 4;
    }

    .pin-1 { left: 18%; top: 26%; }
    .pin-2 { left: 72%; top: 22%; }
    .pin-3 { left: 66%; top: 68%; }
    .pin-4 { left: 22%; top: 72%; }

    .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 10px;
      border-radius: 16px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(53,255,122,0.24);
      text-align: center;
    }

    .stat strong {
      display: block;
      color: white;
      font-size: 18px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .panel {
      padding: 24px;
    }

    .module-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--green-soft);
      font-size: 18px;
      font-weight: 900;
    }

    .section {
      padding: 28px 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .input-group {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      color: var(--green-soft);
      font-weight: 800;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      min-height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(53,255,122,0.26);
      color: white;
      background: rgba(0,0,0,0.28);
      padding: 0 14px;
      outline: none;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
      padding-top: 28px;
    }

    .sidebar {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .sidebar button {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
    }

    .content-area {
      min-height: 620px;
    }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .mini-card {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mini-card b {
      display: block;
      font-size: 26px;
      color: white;
    }

    .mini-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .qr-card, .offer-card, .package-card {
      padding: 18px;
      border-radius: 20px;
      background: rgba(0,0,0,0.24);
      border: 1px solid rgba(53,255,122,0.22);
    }

    .qr-code-box {
      display: grid;
      place-items: center;
      min-height: 120px;
      margin: 12px 0;
      border-radius: 16px;
      background:
        repeating-linear-gradient(45deg, #fff 0 8px, #111 8px 16px);
      color: transparent;
      border: 8px solid white;
    }

    .badge {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--yellow);
      background: rgba(255,215,90,0.1);
      border: 1px solid rgba(255,215,90,0.26);
      font-size: 12px;
      font-weight: 900;
    }

    .map-full {
      position: relative;
      min-height: 420px;
      border-radius: 24px;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid rgba(53,255,122,0.24);
      background:
        linear-gradient(30deg, transparent 0 20%, rgba(255,255,255,0.08) 20% 22%, transparent 22% 62%, rgba(53,255,122,0.08) 62% 64%, transparent 64%),
        radial-gradient(circle at 70% 20%, rgba(78,231,255,0.18), transparent 24%),
        #0a1d12;
    }

    .map-full.placement-mode {
      cursor: crosshair;
      border-color: rgba(255, 215, 90, 0.72);
      box-shadow: inset 0 0 0 2px rgba(255, 215, 90, 0.18), 0 0 28px rgba(255, 215, 90, 0.14);
    }

    .map-full.player-move-mode {
      cursor: pointer;
    }

    /* Fullscreen game: esconder sidebar, nav e app-shell para o mapa ocupar 100% */
    body.game-fullscreen .top-nav,
    body.game-fullscreen .sidebar,
    body.game-fullscreen .app-shell > main > section > .dashboard > aside {
      display: none !important;
    }
    body.game-fullscreen .app-shell {
      padding: 0;
      width: 100%;
    }

    .real-gps-map {
      background:
        linear-gradient(28deg, transparent 0 43%, rgba(255,255,255,0.82) 43% 45%, transparent 45%),
        linear-gradient(118deg, transparent 0 48%, rgba(255,255,255,0.72) 48% 50%, transparent 50%),
        linear-gradient(88deg, transparent 0 52%, rgba(255,255,255,0.58) 52% 53.4%, transparent 53.4%),
        linear-gradient(0deg, transparent 0 38%, rgba(255,255,255,0.52) 38% 39.4%, transparent 39.4%),
        radial-gradient(circle at 28% 32%, rgba(66,215,125,0.42), transparent 7%),
        radial-gradient(circle at 68% 58%, rgba(122,215,255,0.34), transparent 9%),
        radial-gradient(circle at 52% 74%, rgba(215,179,90,0.28), transparent 8%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 72px),
        #8ec7a3;
      border-color: rgba(255,255,255,0.14);
      isolation: isolate;
    }

    .real-gps-map iframe {
      position: absolute;
      left: -10%;
      top: -10%;
      width: 120%;
      height: 120%;
      border: 0;
      filter: saturate(0.82) contrast(0.98) brightness(0.86);
      z-index: 1;
      pointer-events: none;
      display: block;
      transform: translate(var(--map-shift-x, 0px), var(--map-shift-y, 0px));
      transition: transform .16s linear;
    }

    .leaflet-gps-map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .leaflet-container {
      background: #cfe8ff;
      font-family: inherit;
    }

    .offline-local-map {
      position: absolute;
      inset: -80%;
      z-index: 2;
      background:
        linear-gradient(28deg, transparent 0 43%, rgba(255,255,255,0.82) 43% 45%, transparent 45%),
        linear-gradient(118deg, transparent 0 48%, rgba(255,255,255,0.72) 48% 50%, transparent 50%),
        linear-gradient(88deg, transparent 0 52%, rgba(255,255,255,0.58) 52% 53.4%, transparent 53.4%),
        linear-gradient(0deg, transparent 0 38%, rgba(255,255,255,0.52) 38% 39.4%, transparent 39.4%),
        radial-gradient(circle at 28% 32%, rgba(66,215,125,0.42), transparent 7%),
        radial-gradient(circle at 68% 58%, rgba(122,215,255,0.34), transparent 9%),
        radial-gradient(circle at 52% 74%, rgba(215,179,90,0.28), transparent 8%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 72px),
        #8ec7a3;
      transform: translate(var(--map-shift-x, 0px), var(--map-shift-y, 0px));
      transition: transform .16s linear;
    }

    .real-gps-map .range-circle,
    .real-gps-map .avatar {
      left: 50% !important;
      top: 50% !important;
    }

    .real-gps-map::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(5,8,7,0.08) 78%),
        linear-gradient(180deg, rgba(5,8,7,0.04), rgba(5,8,7,0.12));
      pointer-events: none;
      z-index: 3;
    }
       .real-gps-map .range-circle,
    .real-gps-map .flag-pin,
    .real-gps-map .avatar,
    .avatar-vitals {
      z-index: 5;
    }

    .avatar-vitals {
      position: absolute;
      left: 50%;
      top: 14px;
      width: min(420px, calc(100% - 28px));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      pointer-events: none;
    }

    .vital-wrap {
      display: grid;
      gap: 4px;
      color: white;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }

    .vital-line {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0,0,0,0.58);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .vital-fill {
      height: 100%;
      border-radius: inherit;
    }

    .vital-fill.energy {
      background: linear-gradient(90deg, #42d77d, #b9f5cc);
    }

    .vital-fill.hunger {
      background: linear-gradient(90deg, #d7b35a, #ffe39a);
    }

    .range-circle {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px dashed rgba(78,231,255,0.55);
      background: rgba(78,231,255,0.06);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin: 12px 0;
      border-radius: 18px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .map-toolbar select {
      width: auto;
      min-width: 160px;
    }

    .placement-hint {
      color: var(--yellow);
      font-weight: 900;
    }

    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,0.24);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      max-width: 320px;
      padding: 16px;
      border-radius: 18px;
      color: #001506;
      background: linear-gradient(135deg, var(--green), #baffce);
      font-weight: 900;
      box-shadow: var(--shadow);
      display: none;
    }

    .toast.active {
      display: block;
    }

    .brand-footer {
      margin: 28px 0 0;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: rgba(168, 255, 197, 0.58);
    }

    .ghost-admin {
      padding: 0;
      min-height: auto;
      color: inherit;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.72;
    }

    .ghost-admin:hover {
      opacity: 1;
      color: var(--green-soft);
    }
   .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      margin-top: 14px;
    }

    .data-table th,
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      vertical-align: top;
    }

    .data-table th {
      color: var(--green-soft);
      background: rgba(53,255,122,0.08);
    }

    .auth-box {
      max-width: 520px;
    }

    @media (max-width: 900px) {
      .hero, .dashboard, .form-grid, .grid.two, .grid.three, .cards-row {
        grid-template-columns: 1fr;
      }

      .top-nav {
        align-items: flex-start;
        border-radius: 24px;
        flex-direction: column;
      }

      .nav-actions {
        justify-content: flex-start;
      }

      .hero-copy {
        padding: 26px;
      }

      .phone-preview {
        min-height: 520px;
      }

      .mock-map {
        min-height: 484px;
      }
    }

    /* GPS Mode Selector */
    .gps-mode-selector {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .gps-mode-btn {
      flex: 1;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .gps-mode-btn.active {
      background: linear-gradient(135deg, var(--green), #baffce) !important;
      color: #001506 !important;
      border: 1px solid var(--green) !important;
      box-shadow: 0 4px 12px rgba(53, 255, 122, 0.3) !important;
    }

    /* Player Dialog Styles */
    .stats-row {
      display: flex;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .stats-row .badge {
      font-size: 10px;
      padding: 2px 6px;
    }

    .player-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel-strong);
      border: 1px solid var(--green);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .dialog-close {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }

    .dialog-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .message-area {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .message-input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      margin: 8px 0;
    }
    /* QR Market Styles */
    .info-box {
      background: rgba(53, 255, 122, 0.1);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
    }

    .info-box ul {
      margin: 8px 0 0 0;
      padding-left: 20px;
    }

    .info-box li {
      margin: 4px 0;
      font-size: 12px;
    }

    .badge.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .badge.danger {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .qr-card.disabled {
      opacity: 0.6;
      cursor: not-allowed !important;
      transform: none !important;
    }

    .qr-card.disabled:hover {
      transform: none !important;
      box-shadow: var(--shadow) !important;
    }

    /* Bingo Selection Styles */
    .bingo-card {
      position: relative;
      transition: all 0.3s ease;
    }

    .bingo-card.selected {
      border: 2px solid var(--green);
      background: linear-gradient(135deg, rgba(53, 255, 122, 0.1), rgba(53, 255, 122, 0.05));
      transform: scale(1.02);
    }

    .selection-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: var(--green);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      z-index: 10;
    }

    .bulk-actions-panel {
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Porta-moedas Styles */
    .wallet-display {
      background: linear-gradient(135deg, rgba(53, 255, 122, 0.1), rgba(53, 255, 122, 0.05));
      border: 1px solid var(--green);
      border-radius: var(--radius);
      padding: 12px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wallet-display .coins-amount {
      font-size: 18px;
      font-weight: bold;
      color: var(--green);
    }

    .wallet-display .coins-icon {
      font-size: 20px;
      margin-right: 8px;
    }

    .wallet-display .wallet-label {
      font-size: 12px;
      color: var(--text);
      opacity: 0.8;
    }

    .wallet-header {
      background: var(--panel-strong);
      border: 1px solid var(--green);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .wallet-header .coins-amount {
      font-size: 24px;
      font-weight: bold;
      color: var(--green);
      margin: 8px 0;
    }

    .wallet-header .coins-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    /* QRs do jogador à venda */
    .qr-card.own-qr {
      background: linear-gradient(135deg, rgba(53, 255, 122, 0.1), rgba(53, 255, 122, 0.05));
      border: 2px solid var(--green);
      position: relative;
    }
    .qr-card.own-qr::before {
      content: "MEU QR";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--green);
      color: var(--bg);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
    }

    .qr-card.own-qr .badge {
      background: var(--green);
      color: var(--bg);
    }

    /* Relógio decrescente */
    .countdown-timer {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.1), rgba(255, 71, 87, 0.05));
      border: 1px solid rgba(255, 71, 87, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      margin: 8px 0;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #ff4757;
      font-size: 14px;
    }

    .countdown-timer.urgent {
      background: rgba(255, 71, 87, 0.2);
      border-color: #ff4757;
      animation: pulse 1s infinite;
    }

    .countdown-timer.expired {
      background: rgba(108, 117, 125, 0.1);
      border-color: rgba(108, 117, 125, 0.3);
      color: #6c757d;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .timer-label {
      font-size: 10px;
      color: var(--text);
      opacity: 0.7;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Dormant Flag Styles ── */
    .flag-pin.dormant {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .flag-pin.awakening {
      animation: flagAwaken 0.6s ease forwards;
    }
    @keyframes flagAwaken {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .flag-pin.bingo-glow {
      box-shadow: 0 0 18px 6px rgba(215, 179, 90, 0.7), 0 0 40px 12px rgba(215, 179, 90, 0.3);
      border-color: var(--yellow);
      animation: bingoGlow 1s ease infinite alternate;
    }
    @keyframes bingoGlow {
      from { box-shadow: 0 0 18px 6px rgba(215, 179, 90, 0.7), 0 0 40px 12px rgba(215, 179, 90, 0.3); }
      to   { box-shadow: 0 0 28px 10px rgba(215, 179, 90, 0.9), 0 0 60px 18px rgba(215, 179, 90, 0.5); }
    }

    /* ── Dynamic Ticker ── */
    .map-ticker {
      position: relative;
      overflow: hidden;
      height: 32px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(53, 255, 122, 0.18);
      border-radius: 10px;
      margin-top: 8px;
    }
    .map-ticker-inner {
      display: flex;
      gap: 60px;
      white-space: nowrap;
      animation: tickerScroll 28s linear infinite;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--green-soft);
    }
    .map-ticker-inner .jackpot-msg {
      color: #ffcc00;
      text-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
    }
    @keyframes tickerScroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-200%); }
    }

    /* ── Party Mode / Celebration Overlay ── */
    .party-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      animation: partyFadeIn 0.3s ease;
    }
    @keyframes partyFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .party-overlay .party-content {
      text-align: center;
      animation: partyZoomIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes partyZoomIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .party-overlay .party-avatar {
      font-size: 80px;
      margin-bottom: 12px;
      animation: partyBounce 0.8s ease infinite alternate;
    }
    @keyframes partyBounce {
      from { transform: translateY(0); }
      to { transform: translateY(-18px); }
    }
    .party-overlay .party-title {
      font-size: clamp(28px, 6vw, 52px);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #ffcc00;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.6), 0 0 60px rgba(255, 204, 0, 0.3);
      margin: 0 0 8px;
    }
    .party-overlay .party-coins {
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .party-overlay .party-sub {
      font-size: 16px;
      color: var(--green-soft);
      margin-top: 8px;
    }
    /* Fireworks canvas */
    .fireworks-canvas {
      position: fixed;
      inset: 0;
      z-index: 10000;
      pointer-events: none;
    }

    /* ── Loading / Splash Screen ── */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0a0f0d 0%, #0d1a14 50%, #0a0f0d 100%);
      transition: opacity 0.8s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 180px;
      height: auto;
      animation: splashFadeIn 1.2s ease forwards, splashPulse 2s ease-in-out 1.2s infinite;
      opacity: 0;
    }
    @keyframes splashFadeIn {
      0% { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
    .splash-text {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--green-soft);
      opacity: 0;
      animation: splashFadeIn 1s ease 0.6s forwards;
    }
    .splash-bar {
      margin-top: 28px;
      width: 160px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      opacity: 0;
      animation: splashFadeIn 0.8s ease 1s forwards;
    }
    .splash-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--green-soft));
      border-radius: 3px;
      animation: splashBarFill 2s ease 1.2s forwards;
    }
    @keyframes splashBarFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* ── Navbar logo ── */
    .brand-logo-img {
      height: 42px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    /* ── Stock Central Badge ── */
    .stock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(215, 179, 90, 0.15);
      border: 1px solid rgba(215, 179, 90, 0.35);
      color: var(--yellow);
    }
    .stock-badge.demo { background: rgba(122, 215, 255, 0.12); border-color: rgba(122, 215, 255, 0.3); color: var(--cyan); }

    /* ── BackOffice Engine Config Panel ── */
    .engine-config-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 14px 0;
    }
    .engine-config-grid .config-card {
      padding: 16px;
      border-radius: 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .engine-config-grid .config-card h4 {
      margin: 0 0 10px;
      color: var(--green-soft);
      font-size: 14px;
    }
    .engine-config-grid .config-card .input-group {
      margin-bottom: 8px;
    }
    .engine-config-grid .config-card label {
      font-size: 11px;
    }
    .engine-config-grid .config-card input {
      min-height: 36px;
      font-size: 13px;
    }

    /* ── Security Alerts ── */
    .alert-card {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 40, 40, 0.08);
      border: 1px solid rgba(255, 40, 40, 0.3);
      margin-bottom: 10px;
    }
    .alert-card.high { border-color: #ff2828; background: rgba(255, 40, 40, 0.14); }
    .alert-card .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .alert-card .alert-header .alert-severity {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      background: #ff2828;
      color: #fff;
    }
    .alert-card .alert-text {
      font-size: 12px;
      color: rgba(255, 80, 80, 0.9);
      word-break: break-all;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 8px;
      margin: 6px 0;
    }
    .alert-card .alert-meta {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }
    .banned-badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 6px;
      background: #ff2828;
      color: #fff;
      margin-left: 6px;
    }
    .btn.report {
      background: rgba(255, 100, 40, 0.15);
      border: 1px solid rgba(255, 100, 40, 0.4);
      color: #ff8844;
    }
    .btn.report:hover { background: rgba(255, 100, 40, 0.3); }

    /* ── Onboarding Tutorial ── */
    .tutorial-overlay {
      position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      animation: tutFadeIn 0.4s ease;
    }
    @keyframes tutFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .tutorial-card {
      background: var(--panel-strong);
      border: 1px solid rgba(66,215,125,0.25);
      border-radius: var(--radius);
      padding: 32px 28px 24px;
      max-width: 420px; width: 92%;
      box-shadow: var(--shadow);
      text-align: center;
      animation: tutSlideUp 0.45s ease;
    }
    @keyframes tutSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .tutorial-card .tut-icon {
      font-size: 48px; margin-bottom: 10px;
    }
    .tutorial-card h2 {
      color: var(--green); font-size: 20px; margin: 0 0 8px;
    }
    .tutorial-card p {
      color: var(--text); font-size: 14px; line-height: 1.6; margin: 0 0 18px;
    }
    .tutorial-card .tut-step-indicator {
      display: flex; gap: 6px; justify-content: center; margin-bottom: 16px;
    }
    .tutorial-card .tut-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.15); transition: background 0.3s;
    }
    .tutorial-card .tut-dot.active {
      background: var(--green);
    }
    .tutorial-card .tut-actions {
      display: flex; gap: 10px; justify-content: center;
    }
    .tutorial-card .tut-actions .btn { min-width: 110px; }
    /* ── Fixed Help Button ── */
    .help-fab {
      position: fixed; bottom: 24px; right: 24px; z-index: 99990;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--green); color: var(--bg);
      font-size: 26px; font-weight: 800;
      border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(66,215,125,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .help-fab:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(66,215,125,0.55);
    }

    /* ── FAQ Modal ── */
    .faq-overlay {
      position: fixed; inset: 0; z-index: 99995;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      animation: tutFadeIn 0.3s ease;
    }
    .faq-overlay.hidden { display: none; }
    .faq-modal {
      background: var(--panel-strong);
      border: 1px solid rgba(66,215,125,0.2);
      border-radius: var(--radius);
      padding: 28px 24px 20px;
      max-width: 520px; width: 94%; max-height: 80vh;
      overflow-y: auto; box-shadow: var(--shadow);
      animation: tutSlideUp 0.35s ease;
    }
    .faq-modal h2 {
      color: var(--green); font-size: 22px; margin: 0 0 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .faq-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 16px;
      margin-bottom: 10px; cursor: pointer;
      transition: background 0.2s;
    }
    .faq-item:hover { background: rgba(66,215,125,0.08); }
    .faq-item .faq-q {
      color: var(--cyan); font-weight: 700; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .faq-item .faq-q::before { content: '▸'; color: var(--green); }
    .faq-item .faq-a {
      color: var(--muted); font-size: 13px; line-height: 1.55;
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease, margin 0.3s;
      margin-top: 0;
    }
    .faq-item.open .faq-a {
      max-height: 300px; margin-top: 10px;
    }
    .faq-item.open .faq-q::before { content: '▾'; }
    .faq-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none; color: var(--muted);
      font-size: 22px; cursor: pointer; padding: 4px;
    }
    .faq-close:hover { color: var(--red); }
    .faq-modal { position: relative; }

    /* ── Fullscreen Game Mode ── */
    body.game-active { overflow: hidden !important; }
    body.game-active .app-shell { display: none !important; }
    body.game-active .brand-footer { display: none !important; }
    body.game-active::before, body.game-active::after { display: none; }

    .game-layer {
      position: fixed; inset: 0; z-index: 40;
      background: #050807; overflow: hidden;
    }
    .game-layer.hidden { display: none; }

    .game-map-vp {
      position: absolute; inset: 0; overflow: hidden; cursor: pointer;
      background: linear-gradient(135deg, #0a1d12, #08100e);
    }
    .game-map-vp iframe {
      position: absolute; left: -10%; top: -10%; width: 120%; height: 120%;
      border: 0; filter: saturate(0.82) contrast(0.98) brightness(0.86);
      z-index: 1; pointer-events: none;
      transform: translate(var(--map-shift-x, 0px), var(--map-shift-y, 0px));
      transition: transform .16s linear;
    }
    .game-map-vp .leaflet-gps-map { position: absolute; inset: 0; z-index: 1; }
    .game-map-vp .range-circle, .game-map-vp .avatar { left: 50% !important; top: 50% !important; }
    .game-map-vp .range-circle, .game-map-vp .flag-pin, .game-map-vp .avatar { z-index: 5; }
    .game-map-vp .avatar { z-index: 6; }
    .game-map-vp .avatar-vitals { z-index: 7; top: 52px; }
    .game-map-vp::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(5,8,7,0.08) 78%),
                  linear-gradient(180deg, rgba(5,8,7,0.04), rgba(5,8,7,0.12));
      pointer-events: none; z-index: 3;
    }
    .game-map-vp .flag-pin { position: absolute; transform: translate(-50%, -50%); z-index: 4; }
    .game-map-vp .dormant { opacity: 0.35; pointer-events: none; }
    .game-map-vp .bingo-glow { box-shadow: 0 0 18px 4px rgba(255, 204, 0, 0.65); }
