<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Larforyou · ZAP-FLAGS 3.1</title>
  <link rel="stylesheet" href="leaflet.css">
  <style>
    :root {
      --bg: #050807;
      --panel: rgba(10, 18, 16, 0.82);
      --panel-strong: rgba(16, 30, 26, 0.94);
      --green: #42d77d;
      --green-soft: #b9f5cc;
      --cyan: #7ad7ff;
      --yellow: #d7b35a;
      --red: #ff5a6f;
      --text: #ecfff2;
      --muted: #9ac9a8;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 14% 8%, rgba(66, 215, 125, 0.16), transparent 28%),
                  radial-gradient(circle at 90% 16%, rgba(122, 215, 255, 0.10), transparent 30%),
                  linear-gradient(135deg, #020403 0%, #0b1110 52%, #020202 100%);
      overflow: hidden;
    }

    body::before {
      content: "Larforyou ®";
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      font-size: clamp(64px, 14vw, 220px);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.035);
      pointer-events: none;
      z-index: 0;
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app-shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
      position: relative;
      z-index: 1;
      height: 100vh;
      overflow-y: auto;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(4, 7, 6, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 16px;
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: 0.08em; }

    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 14px; background: linear-gradient(135deg, #f4f0df, #8fdcae);
      color: #07110d; box-shadow: 0 0 22px rgba(185, 245, 204, 0.20);
    }

    .nav-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .btn {
      min-height: 42px; padding: 10px 16px; border-radius: 999px;
      background: linear-gradient(135deg, var(--green), #92ffb4);
      color: #001506; font-weight: 900; box-shadow: 0 12px 28px rgba(53, 255, 122, 0.18);
    }

    .btn.secondary { background: rgba(255, 255, 255, 0.06); color: var(--green-soft); border: 1px solid rgba(53, 255, 122, 0.34); box-shadow: none; }
    .btn.danger { background: rgba(255, 90, 111, 0.14); color: #ffdbe0; border: 1px solid rgba(255, 90, 111, 0.44); box-shadow: none; }

    .screen { display: none; animation: show 0.28s ease; }
    .screen.active { display: block; }

    @keyframes show { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
