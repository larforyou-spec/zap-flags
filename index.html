<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAP FLAGS - Arranque</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #34495e;
            --success: #27ae60;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Roboto', sans-serif; overflow: hidden; background-color: var(--primary); }

        /* ECRÃS */
        .screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .active { display: flex; }
        
        /* LOGIN / REGISTO */
        .auth-container { background: white; padding: 2rem; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h1, h2 { color: var(--primary); margin-bottom: 1rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 5px;}
        button.primary { background: var(--accent); color: white; }
        button.secondary { background: var(--dark); color: white; }
        button.outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* MAPA GAME */
        #mapGame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #aab; }
        
        /* HUD / DASHBOARD */
        #hud { 
            position: absolute; top: 10px; left: 10px; right: 10px; 
            z-index: 500; display: flex; justify-content: space-between; pointer-events: none; 
        }
        .hud-panel { 
            background: rgba(255,255,255,0.95); 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--dark);
            pointer-events: auto; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 10px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: red; }
        .status-dot.online { background: green; }

        /* CONTROLOS OFFLINE */
        #offlineControls { 
            position: absolute; bottom: 40px; right: 20px; z-index: 600; 
            display: none; background: rgba(0,0,0,0.5); 
            padding: 10px; border-radius: 50%; 
        }
        .d-pad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .d-pad-btn { 
            width: 45px; height: 45px; background: var(--light); 
            border-radius: 5px; color: var(--dark); font-size: 18px; display: flex;
            align-items: center; justify-content: center; user-select: none;
        }
        .d-pad-btn:active { background: #bdc3c7; }

        /* MODAIS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: none; }
        .modal-overlay.open { display: block; }
        
        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 20px; border-radius: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 1100; 
            width: 90%; max-width: 320px; text-align: center; 
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: translate(-50%, -60%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
        
        .flag-icon-img { width: 80px; height: auto; margin: 10px auto; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    </style>
</head>
<body>

    <!-- TELA DE SELEÇÃO DE MODO -->
    <div id="modeSelect" class="screen active">
        <h1><i class="fas fa-flag-checkered"></i> ZAP FLAGS</h1>
        <p>Aprende, Joga e Ganha.</p>
        
        <button onclick="startApp('JG')" class="primary"><i class="fas fa-running"></i> Jogar (Corrida)</button>
        <button onclick="openRegEmpresa()" class="secondary"><i class="fas fa-store"></i> Empresa / Negócio</button>
    </div>

    <!-- TELA DE LOGIN / AUTH -->
    <div id="loginScreen" class="screen">
        <div class="auth-container">
            <h2 id="authTitle">Login</h2>
            <input type="text" id="username" placeholder="Email ou Contribuinte">
            <input type="password" id="password" placeholder="Password">
            <small id="contactStatus" style="color:var(--accent)"></small>
            
            <button onclick="handleAuth()" class="primary" id="btnLogin">Entrar</button>
            <button onclick="recoveryAction()" class="outline">Esqueci-me da senha</button>
            <button onclick="goBackToHome()" class="outline">Voltar</button>
        </div>
    </div>

    <!-- TELA DO JOGO (MAPA) -->
    <div id="gameScreen" class="screen" style="justify-content: flex-start;">
        <div id="mapGame"></div>
        
        <!-- HUD Superior -->
        <div id="hud">
            <div class="hud-panel">
                <i class="fas fa-map-marker-alt"></i>
                <span id="playerStats">Carteira: <span id="scoreDisplay">0</span>€</span>
            </div>
            <div class="hud-panel">
                <span class="status-dot" id="gpsDot"></span>
                <i class="fas fa-wifi"></i>
                <button onclick="toggleGPS()" style="border:none; background:none; width:auto; color:var(--dark); font-size:12px; margin-left:5px;" title="Parar GPS">⏹</button>
            </div>
        </div>

        <!-- Botão Flutuante para Empresas -->
        <button onclick="showPRDashboard()" style="position: absolute; bottom: 100px; right: 20px; z-index: 400; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
            <i class="fas fa-building"></i>
        </button>

        <!-- Controles Offline (D-Pad) -->
        <div id="offlineControls" class="makeDraggable">
            <div class="d-pad-grid">
                <div></div>
                <div class="d-pad-btn" onclick="movePlayerManual('up')"><i class="fas fa-chevron-up"></i></div>
                <div></div>
                <div class="d-pad-btn" onclick="movePlayerManual('left')"><i class="fas fa-chevron-left"></i></div>
                <div class="d-pad-btn" style="background:var(--success);" onclick="activateHomeMode()"><i class="fas fa-home"></i></div>
                <div class="d-pad-btn" onclick="movePlayerManual('right')"><i class="fas fa-chevron-right"></i></div>
                <div></div>
                <div class="d-pad-btn" onclick="movePlayerManual('down')"><i class="fas fa-chevron-down"></i></div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE BANDAIREIRA (Pacote) -->
    <div id="flagModalOverlay" class="modal-overlay">
        <div class="modal">
            <h3 id="flagTitle">Promoção!</h3>
            <div class="flag-icon-img" id="flagIconPreview">🚩</div>
            <p id="flagDesc">Texto da promoção aqui...</p>
            <hr>
            <small>Distância: <strong id="flagDistance">0m</strong></small><br>
            <button onclick="collectFlag()" class="primary">Recolher & Validar</button>
            <button onclick="closeModals()" class="outline" style="margin-top: 10px;">Fechar</button>
        </div>
    </div>

    <!-- Modal Resultado -->
    <div id="resultModalOverlay" class="modal-overlay">
        <div class="modal">
            <h3 id="resTitle"><i class="fas fa-check-circle" style="color:green"></i> Sucesso</h3>
            <p id="resText"></p>
            <button onclick="document.getElementById('resultModalOverlay').classList.remove('open')" class="primary">Continuar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // =========================================================================
        // 🏠 ARRANQUE (BOOT) & STATE MANAGEMENT
        // =========================================================================
        let game = {
            player: {},
            flags: [],
            companies: []
        };

        const config = {
            startLat: 41.1579, // Porto (exemplo)
            startLng: -8.6291
        };

        // Funções de Estado (Base do Estudo)
        const defaultState = () => ({
            player: { x: 0, y: 0, username: '', score: 0, mode: 'home', lastUpdate: Date.now() },
            flags: [],
            companies: [
                { id: 1, name: "Supermercado Local", logo: "🛒", promo: "10% OFF em frutas" },
                { id: 2, name: "Burger King", logo: "🍔", promo: "Combo Grátis na segunda" },
                { id: 3, name: "Farmácia Centro", logo: "💊", promo: "Gratuito com compra acima de 15€" }
            ]
        });

        function loadState() {
            try {
                const saved = localStorage.getItem('zap_flags_state');
                if(saved) return JSON.parse(saved);
            } catch(e) { console.error("Erro ao carregar save:", e); }
            return defaultState();
        }

        function saveState() {
            localStorage.setItem('zap_flags_state', JSON.stringify(game));
        }

        // Normalização de Dados (Garantir integridade)
        function normalizePlayer(data) {
            if(!data.score) data.score = 0;
            if(!data.username) data.username = "Anon";
            if(isNaN(data.x)) data.x = config.startLng;
            if(isNaN(data.y)) data.y = config.startLat;
            return data;
        }

        function normalizePackage(pkg) {
            if(!pkg.id) pkg.id = Date.now() + Math.random().toString();
            pkg.collected = false;
            return pkg;
        }

        // Inicialização Global
        window.onload = function() {
            game = loadState();
            game.player = normalizePlayer(game.player);
        };

        // =========================================================================
        // 🔐 NAVEGAÇÃO E LOGIN
        // =========================================================================
        let authMode = 'JG'; // JG = Jogador, PR = Proprietário/Registo

        function startApp(mode) {
            authMode = mode;
            switchEntryMode();
        }

        function switchEntryMode() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('loginScreen').classList.add('active');
            
            const btn = document.getElementById('btnLogin');
            const status = document.getElementById('contactStatus');
            
            if(authMode === 'JG') {
                document.getElementById('authTitle').innerText = "Login Jogador";
                btn.innerText = "Entrar";
                status.innerHTML = "<small>Não tem conta? Clique para registar.</small>";
                btn.onclick = () => handleAuth();
            } else {
                document.getElementById('authTitle').innerText = "Acessar Área de Gestão";
                btn.innerText = "Aceder Painel";
                status.innerHTML = "";
                btn.onclick = () => handleAuthPR();
            }
        }

        function handleAuth() {
            const u = document.getElementById('username').value;
            if(u && !u.includes(" ")) { // Validação simples
                game.player.username = u;
                game.player.x = config.startLng;
                game.player.y = config.startLat;
                normalizePlayer(game.player);
                saveState();
                
                // Preparar interface
                updateScoreUI();
                showGameScreen();
            } else {
                alert("Por favor insira um nome válido.");
            }
        }

        function handleAuthPR() {
            // Redireciona para painel administrativo (simulado)
            showPRDashboard();
        }

        function goBackToHome() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('modeSelect').classList.add('active');
        }

        function recoveryAction() {
            alert("No modo demo, a sua senha é a mesma do email.");
        }

        // =========================================================================
        // 🗺️ MAPA E POSIÇÃO
        // =========================================================================
        let map;
        let userMarker;
        let watchID = null;

        function showGameScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            initMap();
        }

        function initMap() {
            // Destroi mapa anterior se existir para limpar memória
            if(map) map.remove(); 

            map = L.map('mapGame').setView([game.player.y, game.player.x], 18);
            
            // Camada OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Ícone Jogador
            createPlayerIcon();

            // Gerar bandeiras iniciais
            refreshFlags();

            // Pedir GPS
            requestGPSMode();
        }

        function createPlayerIcon() {
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:#2c3e50; width:30px; height:30px; border-radius:50%; border:3px solid white; display:flex; justify-content:center; align-items:center; box-shadow: 0 0 10px black;">
                        <i class="fas fa-user-astronaut" style="color:white; font-size:14px;"></i>
                       </div>`,
                iconSize: [30, 30]
            });
            userMarker = L.marker([game.player.y, game.player.x], {icon: icon}).addTo(map);
        }

        // =========================================================================
        // 📡 GPS & MOVIMENTO
        // =========================================================================
        function requestGPSMode() {
            if(navigator.geolocation) {
                document.getElementById('offlineControls').style.display = 'none';
                document.querySelector('#gpsDot').classList.add('online');
                
                watchID = navigator.geolocation.watchPosition(
                    (pos) => updatePosition(pos.coords.latitude, pos.coords.longitude),
                    (err) => handleGeoError(err),
                    { enableHighAccuracy: true }
                );
            } else {
                activateHomeMode();
            }
        }

        function stopGPS() {
            if(watchID !== null) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                document.querySelector('#gpsDot').classList.remove('online');
            }
            activateHomeMode();
        }

        function toggleGPS() {
            if(document.querySelector('#gpsDot').classList.contains('online')) {
                stopGPS();
            } else {
                requestGPSMode();
            }
        }

        function handleGeoError(err) {
            console.warn(`ERRO ${err.code}: ${err.message}`);
            alert("Sem sinal de GPS! Ative o modo offline.");
            activateHomeMode();
        }

        function activateHomeMode() {
             document.getElementById('offlineControls').style.display = 'block';
        }

        function movePlayerManual(dir) {
            const step = 0.0002;
            let lat = game.player.y;
            let lng = game.player.x;

            if(dir === 'up') lat -= step;
            if(dir === 'down') lat += step;
            if(dir === 'left') lng -= step;
            if(dir === 'right') lng += step;

            updatePosition(lat, lng);
        }

        function updatePosition(lat, lng) {
            game.player.y = lat;
            game.player.x = lng;
            game.player.lastUpdate = Date.now();

            if(userMarker) {
                userMarker.setLatLng([lat, lng]);
                map.panTo([lat, lng]); // Centraliza
            }
            
            // Checar proximidade das bandeiras
            checkProximity();
            
            saveState();
        }

        // =========================================================================
        // 🔵 BANDAS & LÓGICA DE NEGÓCIO
        // =========================================================================
        function refreshFlags() {
            // Limpa marcadores existentes do array game.flags para recriar
            // Nota: Em produção, usaríamos IDs únicos para remover do DOM
            
            // Criar 3 pacotes novos perto do jogador
            for(let i=0; i<3; i++) {
                createFlagCandidate();
            }
        }

        function createFlagCandidate() {
            const company = game.companies[Math.floor(Math.random() * game.companies.length)];
            
            // Randomizar posição aleatória num raio aproximado (ajuste +/- 0.0005 ~ 50 metros)
            const rLat = (Math.random() * 0.001) - 0.0005;
            const rLng = (Math.random() * 0.001) - 0.0005;

            const flagData = normalizePackage({
                companyName: company.name,
                logo: company.logo,
                promo: company.promo,
                location: [game.player.y + rLat, game.player.x + rLng]
            });

            game.flags.push(flagData);
            renderFlagMarker(flagData);
        }

        function renderFlagMarker(pkg) {
            // Ícone Personalizado
            const icon = L.divIcon({
                html: `<div style="font-size: 24px;">${pkg.logo}</div>`,
                className: 'custom-flag-icon',
                iconSize: [30, 30]
            });

            const marker = L.marker(pkg.location, {icon: icon}).addTo(map);
            
            // Ao clicar abre modal
            marker.on('click', () => openFlagModal(pkg, marker));
        }

        function openFlagModal(pkg, markerInstance) {
            const dist = getDistanceKm(markerInstance.getLatLng(), new L.LatLng(game.player.y, game.player.x)) * 1000;
            
            document.getElementById('flagTitle').innerText = pkg.companyName;
            document.getElementById('flagDesc').innerText = pkg.promo;
            document.getElementById('flagIconPreview').innerText = pkg.logo;
            document.getElementById('flagDistance').innerText = Math.round(dist) + "m";
            
            // Armazenar referência global
            this.currentFlagObj = { data: pkg, marker: markerInstance };
            
            document.getElementById('flagModalOverlay').classList.add('open');
        }

        function closeModals() {
            document.getElementById('flagModalOverlay').classList.remove('open');
            document.getElementById('resultModalOverlay').classList.remove('open');
        }

        function collectFlag() {
            if(!this.currentFlagObj) return;

            const { data, marker } = this.currentFlagObj;
            
            // Remover do mapa
            map.removeLayer(marker);
            
            // Remover do array lógico
            game.flags = game.flags.filter(f => f.id !== data.id);
            
            // Dar pontos
            updateScore(10);

            // Feedback visual
            document.getElementById('resTitle').innerHTML = "<i class='fas fa-trophy'></i> Parabenos!";
            document.getElementById('resText').innerText = `Você encontrou as ofertas do ${data.companyName}!`;
            document.getElementById('resultModalOverlay').classList.add('open');
            closeModals();

            // Spawnar nova bandeira
            setTimeout(createFlagCandidate, 2000);
        }

        function checkProximity() {
            // Se estiver muito perto de uma bandeira, pode vibrar ou tocar som
        }

        function getDistanceKm(p1, p2) {
            return map.distance(p1, p2) / 1000;
        }

        // =========================================================================
        // 💼 EMPRESA / DASHBOARD
        // =========================================================================
        function openRegEmpresa() {
            authMode = 'PR';
            switchEntryMode();
        }

        function showPRDashboard() {
            const list = game.companies.map(c => 
                `<li style="padding:10px; border-bottom:1px solid #eee;"><i class="fas ${getIconForType(c.name)}"></i> ${c.name}</li>`
            ).join('');

            alert(`Painel da Empresa:\nTotal de Pacotes: ${game.flags.length}\nPacotes Disponíveis:\n${list}`);
        }

        function getIconForType(str) {
            if(str.toLowerCase().includes('super')) return 'fa-shopping-cart';
            if(str.toLowerCase().includes('burger') || str.toLowerCase().includes('restau')) return 'fa-burger';
            if(str.toLowerCase().includes('farmacia')) return 'fa-heartbeat';
            return 'fa-store';
        }

        // Utilitários
        function updateScore(amount) {
            game.player.score += amount;
            updateScoreUI();
            saveState();
        }

        function updateScoreUI() {
            document.getElementById('playerStats').innerHTML = `${game.player.username} | Carteira: <strong>${game.player.score}€</strong>`;
            document.getElementById('scoreDisplay').innerText = game.player.score;
        }

    </script>
</body>
</html>
